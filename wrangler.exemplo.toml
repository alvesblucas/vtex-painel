# Copie para wrangler.toml (não versionado) e preencha. Nada de valores reais neste arquivo.
#   cp wrangler.exemplo.toml wrangler.toml
name = "minhaloja-painel"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"                      # nome usado pelas Functions (env.DB)
database_name = "painel"
database_id = "00000000-0000-0000-0000-000000000000"   # saída de: npx wrangler d1 create painel
migrations_dir = "migrations"

[vars]
LOJA_NOME = "Minha Loja"            # nome no topo do painel
FUSO_HORAS = "-3"                   # fuso da loja em horas (datas AAAA-MM-DD locais)
SUPER_ADMIN = "voce@exemplo.com"    # sempre vê tudo e administra usuários
AGENDA_JSON = '{"pedidos":{"horasMax":3}}'   # atraso máximo por fonte antes do aviso amarelo
# Login: Cloudflare Access (equipe e AUD da aplicação)
ACCESS_TEAM = "minhaequipe"
ACCESS_AUD = "aud-da-aplicacao-no-access"
# Servidor MCP (/mcp) para assistentes de IA — ver README "Usar com Claude (MCP)". Desligado por padrão.
MCP_ATIVO = "0"                     # "1" liga o /mcp
ACCESS_AUD_MCP = "aud-da-aplicacao-do-mcp"   # aplicação Access separada, só do caminho /mcp, com Managed OAuth
MCP_LINHAS_DIA = "2500000"          # teto diário de linhas lidas pelo MCP (cota D1 Free = 5 milhões)

# Desenvolvimento local: crie .dev.vars (não versionado) com, por exemplo:
#   DEV_EMAIL=voce@exemplo.com      (só vale em localhost; dispensa o Access)
#   SUPER_ADMIN=voce@exemplo.com
#   LOJA_NOME=Minha Loja
#   FUSO_HORAS=-3
#   AGENDA_JSON={"pedidos":{"horasMax":3}}
